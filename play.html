  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
  <script>
    const src = document.getElementById('source').textContent;
    const mdPanel = document.getElementById('md');
    const content = document.getElementById('content');
    marked.setOptions({
      highlight: function(code, lang){
        try{ return hljs.highlightAuto(code, lang ? [lang] : undefined).value }catch(e){return code}
      }
    });
    mdPanel.innerHTML = marked.parse(src);

    // Tabs
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
        document.getElementById(btn.dataset.target).style.display='block';
        // initialize on demand
        if(btn.dataset.target==='chess') initChess();
        if(btn.dataset.target==='tetris') initTetris();
      })
    });

    document.getElementById('toggleTheme').addEventListener('click', ()=>{
      document.body.classList.toggle('light');
      if(document.body.classList.contains('light')){
        document.body.style.background = '#f6f8fa'; document.body.style.color='#0b1220';
      } else { document.body.style.background='#0b0f14'; document.body.style.color='#e6edf3'; }
    });

    document.getElementById('download').addEventListener('click', ()=>{
      const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'Code-Citations.html';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // --- Chess ---
    let game = null;
    function initChess(){
      if(game) return;
      game = new Chess();
      drawChessBoard();
      
      document.getElementById('chess-reset').addEventListener('click', ()=>{ 
        game.reset(); 
        drawChessBoard();
        document.getElementById('chess-status').textContent='Resetováno.' 
      });
      document.getElementById('chess-flip').addEventListener('click', ()=>{
        document.getElementById('board').classList.toggle('flipped');
        drawChessBoard();
      });
      
      // Keyboard: enter 2-4 char moves (e.g., "e2e4" or "e4")
      document.getElementById('chess-input').addEventListener('keypress', (e)=>{
        if(e.key==='Enter'){
          const move = game.move(e.target.value, {sloppy: true});
          if(move){ 
            e.target.value=''; 
            drawChessBoard();
            document.getElementById('chess-status').textContent = `Tah: ${move.san} — ${game.turn()==='w'?'bílý':'černý'}`;
            if(game.game_over()) document.getElementById('chess-status').textContent += ' (Hra skončila)';
          } else {
            document.getElementById('chess-status').textContent = 'Neplatný tah!';
            e.target.value = '';
          }
        }
      });
    }
    
    function drawChessBoard(){
      const board = document.getElementById('board');
      const fen = game.fen();
      const rows = fen.split(' ')[0].split('/');
      board.innerHTML = '';
      rows.forEach((row, r)=>{
        const r_html = document.createElement('div');
        r_html.style.display='flex';
        let col=0;
        for(let c=0;c<row.length;c++){
          const ch = row[c];
          if(/\d/.test(ch)) col+=parseInt(ch);
          else {
            const sq = document.createElement('span');
            sq.style.width = sq.style.height = '40px';
            sq.style.display='inline-flex';
            sq.style.alignItems='center';
            sq.style.justifyContent='center';
            sq.style.background = ((r+col)%2===0)?'#baca44':'#7cb342';
            sq.style.color = (ch===ch.toUpperCase())?'white':'black';
            sq.style.fontSize='24px';
            sq.style.fontWeight='bold';
            sq.textContent = ch;
            r_html.appendChild(sq);
            col++;
          }
        }
        board.appendChild(r_html);
      });
    }

    // --- Tetris ---
    let tetris = null;
    function initTetris(){
      if(tetris) return;
      const canvas = document.getElementById('tetris-canvas');
      const ctx = canvas.getContext('2d');
      const COLS = 10, ROWS = 20, BLOCK=24;
      ctx.scale(1,1);
      function makeMatrix(w,h){ const m=[]; while(h--) m.push(new Array(w).fill(0)); return m }
      const colors = [null,'#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C88CFF','#FF8AB3','#9AA4FF'];
      const pieces = 'TJLOSZI';
      function createPiece(type){
        switch(type){
          case 'T': return [[0,1,0],[1,1,1]];
          case 'J': return [[1,0,0],[1,1,1]];
          case 'L': return [[0,0,1],[1,1,1]];
          case 'O': return [[1,1],[1,1]];
          case 'S': return [[0,1,1],[1,1,0]];
          case 'Z': return [[1,1,0],[0,1,1]];
          case 'I': return [[1,1,1,1]];
        }
      }
      let arena = makeMatrix(COLS, ROWS);
      let player = {pos:{x:0,y:0},matrix:null,score:0};
      function collide(arena,player){
        const m=player.matrix; const o=player.pos; for(let y=0;y<m.length;++y) for(let x=0;x<m[y].length;++x) if(m[y][x] && (arena[y+o.y] && arena[y+o.y][x+o.x])!==0) return true; return false
      }
      function merge(arena,player){ player.matrix.forEach((row,y)=>row.forEach((val,x)=>{ if(val) arena[y+player.pos.y][x+player.pos.x]=val })) }
      function rotate(matrix,dir){ for(let y=0;y<matrix.length;++y) for(let x=0;x<y;++x) [matrix[x][y],matrix[y][x]]=[matrix[y][x],matrix[x][y]]; if(dir>0) matrix.forEach(row=>row.reverse()); else matrix.reverse(); }
      function playerDrop(){ player.pos.y++; if(collide(arena,player)){ player.pos.y--; merge(arena,player); playerReset(); arenaSweep(); updateScore(); if(collide(arena,player)){ arena=makeMatrix(COLS,ROWS); player.score=0; updateScore(); } } dropCounter=0 }
      function playerMove(offset){ player.pos.x+=offset; if(collide(arena,player)) player.pos.x-=offset }
      function playerReset(){ const type = pieces[ Math.random()*pieces.length |0 ]; player.matrix = createPiece(type); player.pos.y=0; player.pos.x=(COLS/2|0)-(player.matrix[0].length/2|0) }
      function playerRotate(dir){ const pos = player.pos.x; let offset=1; rotate(player.matrix,dir); while(collide(arena,player)){ player.pos.x+=offset; offset=-(offset+(offset>0?1:-1)); if(offset>player.matrix[0].length){ rotate(player.matrix,-dir); player.pos.x=pos; return } } }
      function arenaSweep(){ let rowCount=1; outer: for(let y=arena.length-1;y>0;--y){ for(let x=0;x<arena[y].length;++x) if(arena[y][x]===0) continue outer; const row=arena.splice(y,1)[0].fill(0); arena.unshift(row); player.score += rowCount*10; rowCount*=2 } }
      function draw(){ ctx.fillStyle='#07121a'; ctx.fillRect(0,0,canvas.width,canvas.height); drawMatrix(arena,{x:0,y:0}); drawMatrix(player.matrix,player.pos); }
      function drawMatrix(matrix,offset){ matrix.forEach((row,y)=>row.forEach((val,x)=>{ if(val){ ctx.fillStyle=colors[val]; ctx.fillRect((x+offset.x)*BLOCK, (y+offset.y)*BLOCK, BLOCK-1, BLOCK-1) } })) }
      function updateScore(){ document.getElementById('tetris-score').textContent = 'Skóre: '+player.score }
      let dropCounter=0, dropInterval=1000, lastTime=0; function update(time=0){ const deltaTime=time-lastTime; lastTime=time; dropCounter+=deltaTime; if(dropCounter>dropInterval){ playerDrop() } draw(); requestId = requestAnimationFrame(update) }
      let requestId=null;
      document.getElementById('tetris-start').addEventListener('click', ()=>{ if(!player.matrix) playerReset(); if(!requestId){ lastTime=0; requestId=requestAnimationFrame(update) } });
      document.getElementById('tetris-pause').addEventListener('click', ()=>{ if(requestId){ cancelAnimationFrame(requestId); requestId=null } else { lastTime=0; requestId=requestAnimationFrame(update) } });
      document.getElementById('tetris-reset').addEventListener('click', ()=>{ arena=makeMatrix(COLS,ROWS); player.score=0; player.matrix=null; updateScore(); draw(); if(requestId){ cancelAnimationFrame(requestId); requestId=null } });
      document.addEventListener('keydown', event=>{
        if(!player.matrix) return;
        if(event.keyCode===37) playerMove(-1);
        else if(event.keyCode===39) playerMove(1);
        else if(event.keyCode===40) playerDrop();
        else if(event.keyCode===38) playerRotate(1);
        else if(event.code==='Space'){ while(!collide(arena,player)) player.pos.y++; player.pos.y--; merge(arena,player); playerReset(); arenaSweep(); updateScore(); }
        draw();
      });
      initTetris = function(){ /* already initialized */ };
      tetris = true;
      draw();
    }
  </script>
